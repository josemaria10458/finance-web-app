name: Desplegar en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se encadenan varios push, publica el último y descarta los intermedios.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:pages

      # Pages devuelve 404.html cuando la ruta no existe como fichero. Al ser
      # una SPA, recargar /finance-web-app/gastos tiene que servir el index
      # para que el router de Angular resuelva la ruta.
      - name: Servir el index en las rutas del router
        run: cp dist/finance-web-app/browser/index.html dist/finance-web-app/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/finance-web-app/browser

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
